# Quick start without Kubernetes:
#   cp .env.example .env            # then set POSTGRES_PASSWORD to any random value
#   docker compose up --build -d    # API on http://127.0.0.1:8080
#   docker compose --profile observability up -d   # + Prometheus on http://127.0.0.1:9090
#   docker compose down -v          # stop and delete the demo data
#
# Everything binds to 127.0.0.1 only, so nothing is exposed to your network.
name: healthqueue

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: healthqueue
      POSTGRES_USER: healthqueue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthqueue -d healthqueue"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
    image: healthqueue-api:compose
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: compose
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://healthqueue:${POSTGRES_PASSWORD}@postgres:5432/healthqueue
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/slo-rules.yaml:/etc/prometheus/slo-rules.yaml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

volumes:
  pgdata:
