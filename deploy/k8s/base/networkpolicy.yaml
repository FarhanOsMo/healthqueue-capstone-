# Zero-trust networking inside the namespace:
#   - nothing may talk to anything unless a policy below allows it
#   - only API pods may reach PostgreSQL
#   - API pods may only call PostgreSQL and cluster DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-http-in
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: healthqueue-api
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress-db-and-dns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: healthqueue-api
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: healthqueue-postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-from-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: healthqueue-postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: healthqueue-api
      ports:
        - port: 5432
          protocol: TCP
