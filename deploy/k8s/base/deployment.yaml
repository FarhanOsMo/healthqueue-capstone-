apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthqueue-api
  labels:
    app.kubernetes.io/name: healthqueue-api
    app.kubernetes.io/component: api
spec:
  replicas: 2 # two pods so one can restart or roll without an outage
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: healthqueue-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below the desired count during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthqueue-api
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: healthqueue-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway # kind has one node; real clusters spread pods
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: healthqueue-api
      containers:
        - name: api
          # Overlays replace this with an immutable digest produced by the pipeline.
          image: healthqueue-api:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: healthqueue-api-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: healthqueue-db
                  key: POSTGRES_PASSWORD
            # Kubernetes expands $(VAR) using variables defined earlier in the list.
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30 # allow up to 60 s to start
          livenessProbe: # restart the container if the process hangs
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe: # stop sending traffic while the database is unreachable
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
