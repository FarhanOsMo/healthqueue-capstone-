# Demo database for the local cluster. In production this is replaced by a
# managed, encrypted, backed-up PostgreSQL service (see docs/adr/0001).
apiVersion: v1
kind: Service
metadata:
  name: healthqueue-postgres
  labels:
    app.kubernetes.io/name: healthqueue-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: healthqueue-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: healthqueue-postgres
  labels:
    app.kubernetes.io/name: healthqueue-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: healthqueue-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: healthqueue-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthqueue-postgres
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # the "postgres" user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: healthqueue
            - name: POSTGRES_USER
              value: healthqueue
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: healthqueue-db
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "healthqueue", "-d", "healthqueue"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "healthqueue", "-d", "healthqueue"]
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
