[project]
name = "healthqueue-api"
version = "0.1.1"
description = "HealthQueue appointment scheduling API - Week 7 DevOps capstone reference implementation"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# The 85% gate is enforced in CI (--cov-fail-under=85), where the PostgreSQL test always runs.
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S311", "S603", "S607"]  # synthetic data uses random; dev scripts call kubectl with fixed args
"scripts/build_*_workbook.py" = ["S311", "E501"]  # long prose strings and Excel formulas

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
