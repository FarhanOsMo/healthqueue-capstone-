apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/instance: healthqueue-local
    app.kubernetes.io/part-of: healthqueue
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
  name: healthqueue
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: healthqueue-local
    app.kubernetes.io/name: healthqueue-api
    app.kubernetes.io/part-of: healthqueue
  name: healthqueue-api
  namespace: healthqueue
---
apiVersion: v1
data:
  APP_ENV: local
  DB_HOST: healthqueue-postgres
  DB_NAME: healthqueue
  DB_USER: healthqueue
  LOG_LEVEL: INFO
  MAX_DAYS_AHEAD: "180"
  SERVICE_NAME: healthqueue-api
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: healthqueue-local
    app.kubernetes.io/name: healthqueue-api
    app.kubernetes.io/part-of: healthqueue
  name: healthqueue-api-config
  namespace: healthqueue
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: healthqueue-local
    app.kubernetes.io/name: healthqueue-api
    app.kubernetes.io/part-of: healthqueue
  name: healthqueue-api
  namespace: healthqueue
spec:
  ports:
  - name: http
    nodePort: 30080
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: healthqueue-api
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: healthqueue-local
    app.kubernetes.io/name: healthqueue-postgres
    app.kubernetes.io/part-of: healthqueue
  name: healthqueue-postgres
  namespace: healthqueue
spec:
  clusterIP: None
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
  selector:
    app.kubernetes.io/name: healthqueue-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: healthqueue-local
    app.kubernetes.io/name: healthqueue-api
    app.kubernetes.io/part-of: healthqueue
  name: healthqueue-api
  namespace: healthqueue
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: healthqueue-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/component: api
        app.kubernetes.io/name: healthqueue-api
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: healthqueue-db
        - name: DATABASE_URL
          value: postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)
        envFrom:
        - configMapRef:
            name: healthqueue-api-config
        image: kind-registry:5000/healthqueue-api@sha256:583efbe90ec196a084ac129ded19e2cae9196ec16cc458d32ff156d3a7d71b9c
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        name: api
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: healthqueue-api
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: healthqueue-api
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - emptyDir:
          sizeLimit: 16Mi
        name: tmp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: healthqueue-local
    app.kubernetes.io/name: healthqueue-postgres
    app.kubernetes.io/part-of: healthqueue
  name: healthqueue-postgres
  namespace: healthqueue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: healthqueue-postgres
  serviceName: healthqueue-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database
        app.kubernetes.io/name: healthqueue-postgres
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POSTGRES_DB
          value: healthqueue
        - name: POSTGRES_USER
          value: healthqueue
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: healthqueue-db
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - healthqueue
            - -d
            - healthqueue
          initialDelaySeconds: 20
          periodSeconds: 15
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - healthqueue
            - -d
            - healthqueue
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 384Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /var/run/postgresql
          name: run
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 70
        runAsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: run
      - emptyDir: {}
        name: tmp
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/instance: healthqueue-local
    app.kubernetes.io/part-of: healthqueue
  name: healthqueue-api
  namespace: healthqueue
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: healthqueue-api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/instance: healthqueue-local
    app.kubernetes.io/part-of: healthqueue
  name: api-allow-http-in
  namespace: healthqueue
spec:
  ingress:
  - ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: healthqueue-api
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/instance: healthqueue-local
    app.kubernetes.io/part-of: healthqueue
  name: api-egress-db-and-dns
  namespace: healthqueue
spec:
  egress:
  - ports:
    - port: 5432
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: healthqueue-postgres
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  podSelector:
    matchLabels:
      app.kubernetes.io/name: healthqueue-api
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/instance: healthqueue-local
    app.kubernetes.io/part-of: healthqueue
  name: default-deny-all
  namespace: healthqueue
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/instance: healthqueue-local
    app.kubernetes.io/part-of: healthqueue
  name: postgres-allow-from-api
  namespace: healthqueue
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: healthqueue-api
    ports:
    - port: 5432
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: healthqueue-postgres
  policyTypes:
  - Ingress
