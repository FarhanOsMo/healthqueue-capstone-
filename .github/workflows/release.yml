# Release - the ONLY workflow that publishes, signs and attests.
#
# Runs only for version tags (v*) pushed by maintainers, or manually. Pull
# requests can never reach this workflow, so untrusted code never gets the
# OIDC token, the registry write permission or the attestation permission.
#
# Flow: test -> build -> Trivy gate -> push to GHCR -> SBOM (Syft) ->
#       keyless Cosign signature + SBOM attestation -> GitHub SLSA build
#       provenance -> VERIFY everything -> open a GitOps PR pinning the digest.
#
# Cost: GHCR storage/bandwidth for public packages and Actions minutes for
# public repos on standard runners are free. Sigstore public-good (Fulcio/Rekor)
# is free. Signatures are recorded in the PUBLIC Rekor transparency log.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {} # nothing by default; each job asks only for what it needs

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-finished publish

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222

jobs:
  test:
    name: Re-run tests on the tagged commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check . && python -m pytest -q

  publish:
    name: Build, scan, push, SBOM, sign, attest, verify
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release # add required reviewers in repo settings for a manual gate
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing (Sigstore) + provenance, via GitHub OIDC
      attestations: write # store GitHub artifact attestations
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.ref.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute names
        id: names
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/healthqueue-api" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build image (local only - nothing is pushed before the scan passes)
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          VERSION: ${{ steps.names.outputs.version }}
        run: docker build --build-arg APP_VERSION="$VERSION" -t "$IMAGE:$VERSION" .

      - name: Trivy gate (fail on fixable HIGH/CRITICAL)
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          mkdir -p evidence
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/evidence:/out" "$TRIVY_IMAGE" \
            image --scanners vuln --format json --output /out/trivy.json "$IMAGE:$VERSION"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:$VERSION"

      - name: Log in to GHCR (short-lived GITHUB_TOKEN, no stored secret)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push and capture the immutable digest
        id: ref
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          docker push "$IMAGE:$VERSION"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION" | cut -d@ -f2)"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: SBOM with Syft (SPDX JSON) for the pushed digest
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.ref.outputs.image }}@${{ steps.ref.outputs.digest }}
          format: spdx-json
          output-file: evidence/sbom.spdx.json
          upload-artifact: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: Fulcio issues a short-lived certificate bound to THIS workflow's
      # OIDC identity; there is no private key to leak or rotate.
      - name: Cosign sign (keyless, by digest)
        env:
          REF: ${{ steps.ref.outputs.image }}@${{ steps.ref.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Cosign attest SBOM
        env:
          REF: ${{ steps.ref.outputs.image }}@${{ steps.ref.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate evidence/sbom.spdx.json "$REF"

      - name: GitHub SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.ref.outputs.digest }}
          push-to-registry: true

      # ---- Verification: the release fails unless every check passes ----
      - name: Verify signature (identity = this repo's release workflow on a tag)
        env:
          REF: ${{ steps.ref.outputs.image }}@${{ steps.ref.outputs.digest }}
        run: |
          cosign verify "$REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/v" \
            > evidence/cosign-verify.json

      - name: Verify SBOM attestation
        env:
          REF: ${{ steps.ref.outputs.image }}@${{ steps.ref.outputs.digest }}
        run: |
          cosign verify-attestation "$REF" --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/v" \
            > /dev/null

      - name: Verify SLSA provenance (gh attestation verify)
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.ref.outputs.image }}@${{ steps.ref.outputs.digest }}
        run: |
          gh attestation verify "oci://$REF" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
            --format json > evidence/provenance-verify.json

      - name: Upload release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ github.ref_name }}
          path: evidence/
          retention-days: 90

  # Optional: archive evidence in the OpenTofu-managed S3 bucket via OIDC.
  # Disabled unless the repository variable AWS_EVIDENCE_ROLE_ARN is set, so
  # the default setup never touches AWS (zero cost).
  archive-evidence:
    name: Archive evidence to S3 (optional, off by default)
    needs: [publish]
    if: ${{ vars.AWS_EVIDENCE_ROLE_ARN != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ github.ref_name }}
          path: evidence
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_EVIDENCE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Upload (write-only role, versioned + KMS-encrypted bucket)
        env:
          BUCKET: ${{ vars.AWS_EVIDENCE_BUCKET }}
        run: aws s3 cp evidence "s3://${BUCKET}/releases/${GITHUB_REF_NAME}/" --recursive

  # GitOps hand-off: CI never touches the cluster. It proposes a Git change
  # (new digest) as a pull request; a human reviews and merges; Argo CD syncs.
  gitops-pr:
    name: Open GitOps PR pinning the signed digest
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Update production overlay digest and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          IMAGE: ${{ needs.publish.outputs.image }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BRANCH="gitops/release-${GITHUB_REF_NAME}"
          sed -i -E "s|^(    digest: )sha256:[0-9a-f]{64}|\1${DIGEST}|" deploy/k8s/overlays/production/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "deploy(production): ${IMAGE}@${DIGEST} (${GITHUB_REF_NAME})"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Deploy ${GITHUB_REF_NAME} to production" \
            --body "Pins ${IMAGE}@${DIGEST}. Signature, SBOM attestation and SLSA provenance were verified in ${RUN_URL}."
