# Dependabot (free on GitHub) opens PRs for outdated or vulnerable dependencies.
# Every update goes through CI (tests + Trivy + review) like any other change.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
